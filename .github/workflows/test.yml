name: Test

on:
  # `push` gates main. Work here lands by DIRECT PUSH to main, so a `pull_request`
  # trigger alone gated nothing: this workflow had never run once and main was
  # completely unchecked.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Kept for re-measuring the matrix without a commit. It earned its place: the
  # concern that blocked this change was that node 24 would fail because
  # better-sqlite3 11.10.0 ships no prebuild for it. Dispatched before wiring
  # `push`, all 12 jobs passed - node 24 included, on ubuntu AND windows. The
  # hypothesis was never tested, only repeated.
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the supported platforms (Linux + Windows 10/11) and the Node
        # floor (20), the documented target (22), and current (24).
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: npm ci
      - run: bun run typecheck
      # Prettier was a defined-but-unwired script; enforce it so style/EOL drift
      # can't return. Passes on a fresh checkout (.gitattributes pins eol=lf).
      - run: bun run format:check
      # Core suite (src/ + setup/). The skills-engine tests are git-heavy and
      # run as a separate Linux-only job below (the `engine` job).
      - run: npx vitest run src/ setup/

  # The skills-engine suite (update/rebase/merge/apply/customize) historically
  # ran in no CI workflow at all, so regressions there went uncaught. Run the
  # full `vitest` suite on Linux, where the git-driven tests are fast and
  # deterministic. (They now also pass natively on Windows, but are kept off the
  # Windows matrix to avoid process-spawn-timing flakiness.)
  engine:
    name: engine (ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bun run test

  # The container-side agent-runner is a separate npm package with its own
  # lockfile; it was previously built/type-checked in no workflow. Validate it
  # compiles so regressions there are caught.
  agent-runner:
    name: agent-runner (ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: container/agent-runner
      - run: bun run build
        working-directory: container/agent-runner
